extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
  file_storage:
    directory: /var/lib/otelcol
receivers:
  filelog:
    include:
      - "/var/log/pods/*/*/*.log"
    exclude:
      - "/var/log/pods/*_${env:MY_POD_NAME}_*/collector/*.log"
    start_at: end
    retry_on_failure:
      enabled: true
    storage: file_storage
    include_file_path: true
    include_file_name: false
    operators:
      - type: container
        id: container-parser
        max_log_size: 102400
  hostmetrics:
    root_path: /hostfs
    collection_interval: 10s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points:
            - ^/dev($|/)
            - ^/proc($|/)
            - ^/sys($|/)
            - ^/run/k3s/containerd($|/)
            - ^/var/lib/docker($|/)
            - ^/var/lib/kubelet($|/)
            - ^/snap($|/)
          match_type: regexp
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs]
          match_type: strict
      network: {}
  kubeletstats:
    collection_interval: 20s
    auth_type: serviceAccount
    endpoint: ${env:K8S_NODE_IP}:10250
    insecure_skip_verify: ${env:KUBELET_INSECURE_SKIP_VERIFY}
processors:
  k8s_attributes:
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
    extract:
      otel_annotations: true
      metadata: [k8s.cluster.uid, k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.deployment.name, k8s.replicaset.name, k8s.daemonset.name, k8s.job.name, k8s.container.name, k8s.cronjob.name, k8s.statefulset.name, container.image.tag, container.image.name, service.namespace, service.name, service.version, service.instance.id]
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/superlog:
    attributes:
      - key: k8s.cluster.name
        value: ${env:SUPERLOG_CLUSTER_NAME}
        action: upsert
  batch: {}
exporters:
  otlp_http/superlog:
    endpoint: ${env:SUPERLOG_ENDPOINT}
    headers:
      x-api-key: ${env:SUPERLOG_API_KEY}
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m
service:
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, k8s_attributes, resource/superlog, batch]
      exporters: [otlp_http/superlog]
    metrics:
      receivers: [hostmetrics, kubeletstats]
      processors: [memory_limiter, k8s_attributes, resource/superlog, batch]
      exporters: [otlp_http/superlog]
