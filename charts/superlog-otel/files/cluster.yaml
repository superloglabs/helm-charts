extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
      http:
        endpoint: ${env:MY_POD_IP}:4318
  k8s_cluster:
    collection_interval: 10s
  k8sobjects:
    objects:
      - name: events
        mode: watch
        group: events.k8s.io
        exclude_watch_type: [DELETED]
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: superlog-otel-cluster
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:MY_POD_IP}:8888"]
processors:
  k8s_attributes:
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
    extract:
      otel_annotations: true
      metadata: [k8s.cluster.uid, k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.deployment.name, k8s.replicaset.name, k8s.daemonset.name, k8s.job.name, k8s.container.name, k8s.cronjob.name, k8s.statefulset.name, container.image.tag, container.image.name, service.namespace, service.name, service.version, service.instance.id]
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/superlog:
    attributes:
      - key: k8s.cluster.name
        value: ${env:SUPERLOG_CLUSTER_NAME}
        action: upsert
  batch: {}
exporters:
  otlp_http/superlog:
    endpoint: ${env:SUPERLOG_ENDPOINT}
    headers:
      x-api-key: ${env:SUPERLOG_API_KEY}
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m
service:
  extensions: [health_check]
  telemetry:
    resource:
      service.name: ${env:SUPERLOG_COLLECTOR_SERVICE_NAME}
      service.version: ${env:SUPERLOG_CHART_VERSION}
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:MY_POD_IP}
                port: 8888
  pipelines:
    logs:
      receivers: [otlp, k8sobjects]
      processors: [memory_limiter, k8s_attributes, resource/superlog, batch]
      exporters: [otlp_http/superlog]
    metrics:
      receivers: [prometheus/internal, otlp, k8s_cluster]
      processors: [memory_limiter, k8s_attributes, resource/superlog, batch]
      exporters: [otlp_http/superlog]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8s_attributes, resource/superlog, batch]
      exporters: [otlp_http/superlog]
