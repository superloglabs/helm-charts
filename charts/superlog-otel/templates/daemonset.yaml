{{- if .Values.collectors.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "superlog-otel.componentName" (dict "root" . "component" "agent") }}
  labels:
    {{- include "superlog-otel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "superlog-otel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-agent.yaml") . | sha256sum }}
      labels:
        {{- include "superlog-otel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "superlog-otel.componentName" (dict "root" . "component" "agent") }}
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/conf/relay.yaml"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: KUBELET_INSECURE_SKIP_VERIFY
              value: {{ .Values.collectors.agent.kubelet.insecureSkipVerify | quote }}
            - name: SUPERLOG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "superlog-otel.authSecretName" . }}
                  key: {{ .Values.global.superlog.existingSecret.key | quote }}
            - name: SUPERLOG_ENDPOINT
              value: {{ required "global.superlog.endpoint is required" .Values.global.superlog.endpoint | quote }}
            - name: SUPERLOG_CLUSTER_NAME
              value: {{ default .Release.Name .Values.global.superlog.clusterName | quote }}
            - name: SUPERLOG_COLLECTOR_SERVICE_NAME
              value: {{ printf "%s-agent" .Chart.Name | quote }}
            - name: SUPERLOG_CHART_VERSION
              value: {{ .Chart.Version | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            {{- toYaml .Values.collectors.agent.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlibotelcol
              mountPath: /var/lib/otelcol
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: config
          configMap:
            name: {{ include "superlog-otel.componentName" (dict "root" . "component" "agent") }}
            items:
              - key: relay
                path: relay.yaml
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlibotelcol
          hostPath:
            path: /var/lib/superlog-otel/{{ .Release.Name }}
            type: DirectoryOrCreate
        - name: hostfs
          hostPath:
            path: /
      {{- with .Values.collectors.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
