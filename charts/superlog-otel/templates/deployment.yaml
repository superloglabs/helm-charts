{{- if .Values.collectors.cluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "superlog-otel.componentName" (dict "root" . "component" "cluster") }}
  labels:
    {{- include "superlog-otel.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "superlog-otel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cluster
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-cluster.yaml") . | sha256sum }}
      labels:
        {{- include "superlog-otel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cluster
    spec:
      serviceAccountName: {{ include "superlog-otel.componentName" (dict "root" . "component" "cluster") }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collectors.cluster.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/conf/relay.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SUPERLOG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "superlog-otel.authSecretName" . }}
                  key: {{ .Values.global.superlog.existingSecret.key | quote }}
            - name: SUPERLOG_ENDPOINT
              value: {{ required "global.superlog.endpoint is required" .Values.global.superlog.endpoint | quote }}
            - name: SUPERLOG_CLUSTER_NAME
              value: {{ default .Release.Name .Values.global.superlog.clusterName | quote }}
            - name: SUPERLOG_COLLECTOR_SERVICE_NAME
              value: {{ printf "%s-cluster" .Chart.Name | quote }}
            - name: SUPERLOG_CHART_VERSION
              value: {{ .Chart.Version | quote }}
          ports:
            - name: otlp
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            {{- toYaml .Values.collectors.cluster.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "superlog-otel.componentName" (dict "root" . "component" "cluster") }}
            items:
              - key: relay
                path: relay.yaml
{{- end }}
